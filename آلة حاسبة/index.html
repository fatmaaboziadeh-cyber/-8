<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الآلة الحاسبة</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="calculator">

        <h2>الآلة الحاسبة</h2>

        <div class="display">
            <input type="text" id="result" value="0" readonly>
        </div>

        <div class="buttons">

            <button class="special" data-action="clear">C</button>
            <button class="special" data-action="delete">⌫</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="zero" data-value="0">0</button>
            <button data-value=".">.</button>

            <button class="equal" data-action="calculate">=</button>

        </div>

    </div>

</body>
</html>
